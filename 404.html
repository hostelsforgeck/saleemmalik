<!DOCTYPE html>
<html lang="en" class="hide-scrollbar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SALEEM MALIK PV</title>
    <meta name="description" content="Lead developer and designer" />
    <meta name="inspiration" content="This project is inspired by Bentox by tamer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preload" as="image" href="assets/img/moon/moon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">

    <style>
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        :root {
            --background-color: hsl(0 0% 5%);
            --foreground-color: hsl(0 0% 77%);
            --border-card: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.15);
            --border-radius: 20px;
            --darker-bg-color: #0D0D0D;
            --card-bg-color: #121212;
            --moon-glow-color: rgba(255, 255, 255, 0.1);
            --gradient-end: rgba(0, 0, 0, 0);
            --row-height: 220px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cal Sans', sans-serif;
            font-weight: 100;
            background-color: var(--background-color);
            color: var(--foreground-color);
            transition: all 0.3s ease;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .main-container {
            width: 100%;
            max-width: 93.8%;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
                        border-radius: var(--border-radius);

        }

        .grid-container {
            display: grid;
            min-height: 725px;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
            padding: 16px;
            grid-template-areas:
                "news news news news news news news news news news news news"
                "news news news news news news news news news news news news"
                "news news news news news news news news news news news news";
            border: 1px solid var(--border-card);
            border-radius: 23px;
            overflow: visible;
            background-color: var(--darker-bg-color);
            width: 100%;
            max-width: 1440px;
        }

        .newsletter-card {
            grid-area: news;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: var(--card-bg-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-card);
            opacity: 0;
            filter: blur(10px);
            transform: translateY(20px);
            animation: blurFadeIn 0.8s ease-out forwards;
        }

        .newsletter-card:hover {
            transform: translateY(-1px);
            border-color: var(--border-hover);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        @keyframes blurFadeIn {
            0% {
                opacity: 0;
                filter: blur(10px);
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        .newsletter-content {
            position: relative;
            z-index: 10;
        }

        .newsletter-content h2,
        .newsletter-content h3 {
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        h2 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 500;
            margin-bottom: 1rem;
        }

        h3 {
            font-size: clamp(0.7rem, 2vw, 0.75rem);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            color: #888888;
        }

        .newsletter-content p {
            font-size: clamp(0.9rem, 2vw, 1rem);
            line-height: 1.6;
            color: #bbb;
            text-shadow: 1px 1px 4px #000;
        }

        /* Stars container */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0.8);
            }
            50% {
                opacity: var(--brightness);
                transform: scale(1.2);
            }
        }

        .moon-container {
            position: absolute;
            top: -150px;
            right: -1000px;
            width: 100%;
            height: 100%;
            opacity: 1;
            z-index: 5;
            pointer-events: none;
            scale: 1.7;
            transform-origin: right center;
            animation: float 15s ease-in-out infinite;
        }

        .moon-container:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, var(--moon-glow-color) 0%, var(--gradient-end) 70%);
            pointer-events: none;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-10px) rotate(1deg);
            }
        }

        /* Tablet styles */
        @media (max-width: 1024px) {
            .main-container {
                padding: 12px;
            }

            .grid-container {
                min-height: 720px;
                gap: 12px;
                padding: 12px;
            }

            .newsletter-card {
                padding: 28px;
            }

            .moon-container {
                scale: 1.5;
                top: -100px;
                right: -800px;
            }
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            :root {
                --row-height: 250px;
                --border-radius: 16px;
            }

            body {
                padding: 0;
            }

            .main-container {
                padding: 8px;
            }

            .grid-container {
                min-height: 700px;
                gap: 8px;
                padding: 18px;
                overflow: visible;
            }

            .newsletter-card {
                padding: 24px;
                overflow: hidden;
            }

            h3 {
                letter-spacing: 2px;
                margin-bottom: 8px;
            }

            .moon-container {
                scale: 1.4;
                top: auto;
                bottom: -180px;
                right: -100px;
                transform-origin: bottom right;
                z-index: 1;
            }

            .moon-container:after {
                background: radial-gradient(circle at center, rgba(255, 255, 255, 0.15) 0%, var(--gradient-end) 60%);
            }
        }

        /* Small mobile styles */
        @media (max-width: 480px) {
            .main-container {
                padding: 6px;
            }

            .grid-container {
                min-height: 700px;
                gap: 6px;
                padding: 12px;
                border-radius: 14px;
            }

            .newsletter-card {
                padding: 20px;
                border-radius: 14px;
            }

            .newsletter-content p br {
                display: none;
            }

            h3 {
                font-size: 0.65rem;
                letter-spacing: 2.5px;
            }

            .moon-container {
                scale: 1.1;
                bottom: -290px;
                right: -0px;
                opacity: 1;
            }

            .moon-container:after {
                background: radial-gradient(circle at center, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.12) 30%, rgba(255, 255, 255, 0.06) 50%, var(--gradient-end) 70%);
                filter: blur(2px);
            }
        }

        /* Extra small devices */
        @media (max-width: 360px) {
            .main-container {
                padding: 4px;
            }

            .grid-container {
                min-height: 700px;
                padding: 10px;
            }

            .newsletter-card {
                padding: 16px;
            }

            h2 {
                font-size: 1.4rem;
            }

            h3 {
                font-size: 0.6rem;
                letter-spacing: 2px;
            }

            .moon-container {
                scale: 1.1;
                bottom: -210px;
                right: 0px;
                opacity: 1;
            }

            .moon-container:after {
                background: radial-gradient(circle at center, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.14) 30%, rgba(255, 255, 255, 0.07) 50%, var(--gradient-end) 65%);
                filter: blur(2px);
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="grid-container">
            <div class="newsletter-card relative">
                <div class="stars-container" id="stars"></div>
                <div class="moon-container" id="moon-canvas"></div>
                <div class="newsletter-content relative z-10 text-white">
                    <h3 style="text-shadow: 2px 2px 8px #000; letter-spacing: 3px;">ERROR 404</h3>
                    <h2 style="text-shadow: 2px 2px 8px #000;">Page Lost in Orbit</h2>
                    <p>
                        You've drifted beyond the signal.<br>
                        Sometimes the best signals hide in the static,<br>
                        waiting for those who listen differently.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create twinkling stars
        function createStars() {
            const container = document.getElementById('stars');
            const starCount = 80; // Number of stars

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random position
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                // Random animation properties
                const duration = 2 + Math.random() * 4; // 2-6 seconds
                const delay = Math.random() * 5; // 0-5 seconds
                const brightness = 0.3 + Math.random() * 0.7; // 0.3-1.0
                
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--delay', `${delay}s`);
                star.style.setProperty('--brightness', brightness);
                
                container.appendChild(star);
            }
        }

        // Initialize stars when page loads
        window.addEventListener('DOMContentLoaded', createStars);
    </script>

    <script src="./assets/js/index/moon.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/99/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/TweenMax.min.js"></script>
</body>

</html>
