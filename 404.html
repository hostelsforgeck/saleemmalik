<!DOCTYPE html>
<html lang="en" class="hide-scrollbar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SALEEM MALIK PV</title>
    <meta name="description" content="Lead developer and designer" />
    <meta name="inspiration" content="This project is inspired by Bentox by tamer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="assets/img/moon/moon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">

    <style>
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        :root {
            --background-color: hsl(0 0% 5%);
            --foreground-color: hsl(0 0% 77%);
            --border-card: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.15);
            --border-radius: 20px;
            --darker-bg-color: #0D0D0D;
            --card-bg-color: #121212;
            --moon-glow-color: rgba(255, 255, 255, 0.1);
            --gradient-end: rgba(0, 0, 0, 0);
            --row-height: 220px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cal Sans';
            font-weight: 100;
            background-color: var(--background-color);
            color: var(--foreground-color);
            transition: all 0.3s ease;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            min-width: 1440px;
            margin: 0 auto;
            padding: 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            display: grid;
            min-height: 725px;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
            padding: 16px;
            grid-template-areas:
                "news news news news news news news news news news news news"
                "news news news news news news news news news news news news"
                "news news news news news news news news news news news news";
            border: 1px solid var(--border-card);
            border-radius: var(--border-radius);
            overflow: hidden;
            background-color: var(--darker-bg-color);
            width: 100%;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .grid-container::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .newsletter-card {
            grid-area: news;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: var(--card-bg-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-card);
            opacity: 0;
            filter: blur(10px);
            transform: translateY(20px);
            animation: blurFadeIn 0.8s ease-out forwards;
        }

        .newsletter-card:hover {
            transform: translateY(-1px);
            border-color: var(--border-hover);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        @keyframes blurFadeIn {
            0% {
                opacity: 0;
                filter: blur(10px);
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        .newsletter-content {
            position: relative;
            z-index: 2;
        }

        .newsletter-content h2,
        .newsletter-content h3 {
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        h2 {
            font-size: 24px;
            font-weight: 500;
        }

        h3 {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            color: #888888;
        }

        .moon-container {
            position: absolute;
            top: -150px;
            right: -1000px;
            width: 100%;
            height: 100%;
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
            scale: 1.7;
            transform-origin: right center;
            animation: float 15s ease-in-out infinite;

        }

        .moon-container:after {

            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, var(--moon-glow-color) 0%, var(--gradient-end) 70%);
            pointer-events: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-10px) rotate(1deg);
            }
        }

        @media (max-width: 768px) {
            :root {
                --row-height: 250px;
            }

            .newsletter-card {
                padding: 24px;
            }

            h2 {
                font-size: 24px;
                letter-spacing: 0.8px;
            }
        }
    </style>
</head>

<body>
    <div class="min-h-screen bg-[#0D0D0D] flex items-center justify-center text-center">
        <div class="main-container">
            <div class="grid-container">
                <div class="newsletter-card relative">
                    <div class="moon-container" id="moon-canvas"></div>
                    <div class="newsletter-content relative z-10 text-white">
                        <h3 style="text-shadow: 2px 2px 8px #000; letter-spacing: 3px;">ERROR 404</h3>
                        <h2 style="text-shadow: 2px 2px 8px #000; font-size: 2rem; margin-bottom: 1rem;">Page Lost in
                            Orbit</h2>
                        <p style="text-shadow: 1px 1px 4px #000; color: #bbb; font-size: 1rem; line-height: 1.6;">
                            You’ve drifted beyond the signal.<br>
                            Sometimes the best signals hide in the static,<br>
                            waiting for those who listen differently.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="./assets/js/index/moon.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/99/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/TweenMax.min.js"></script>
</body>

</html>
